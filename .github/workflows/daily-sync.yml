# Sincroniza conteúdo (issues → atividades, gráficos) e commita em docs/.
# NÃO faz mais deploy: o site agora é o portal Astro, publicado pelo workflow
# "Deploy portal (Astro)", que dispara via workflow_run quando este termina.
name: 🌙 Daily Content Sync

on:
  schedule:
    - cron: '0 15 * * *' # Todo dia às 12:00 BRT (15:00 UTC)
  workflow_dispatch: # Permite execução manual
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: "site-sync"
  cancel-in-progress: true

permissions:
  contents: write  # Para commit + push das atualizações em docs/
  issues: read     # Para ler issues no sync_activities

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para o gh-deploy ter acesso ao histórico completo

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependências
        run: pip install -r requirements.txt

      - name: 🔄 Sincronizar atividades das issues do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_activities.py

      - name: 📊 Gerar gráficos do dashboard
        run: python scripts/generate_charts.py

      - name: 💾 Commit e push das alterações
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add \
            data/tasks.csv \
            docs/atividades/ \
            docs/dashboards/graficos/ \
            docs/index.md
          git diff --cached --quiet || git commit -m "chore(bot): atualização noturna de atividades e dashboards [skip ci]"
          git push
        # O deploy do portal Astro é disparado automaticamente ao fim deste
        # workflow (ver workflow_run em deploy-web.yml).
